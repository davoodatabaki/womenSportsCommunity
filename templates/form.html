<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>sportgemeenschap voor vrouwen</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 420px;
        }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input[type="text"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .checkbox-group {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            gap: 5px;
            margin-top: 0;
        }
        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #357ab8; }
        .flash {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .success { background: #d4edda; color: #155724; }
        .error   { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registratie</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/">
            <label for="naam">Naam *</label>
            <input type="text" id="naam" name="naam" value="{{ naam or '' }}" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>

            <label for="leeftijd">Leeftijd *</label>
            <input type="number" id="leeftijd" name="leeftijd"
                value="{{ leeftijd or '' }}" min="1" max="120" required>

            <label>Rol (selecteer minstens één):</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="speler"  value="yes" {% if speler  %}checked{% endif %}> Speler</label>
                <label><input type="checkbox" name="bestuur" value="yes" {% if bestuur %}checked{% endif %}> Bestuur</label>
                <label><input type="checkbox" name="sponsor" value="yes" {% if sponsor %}checked{% endif %}> Sponsor</label>
            </div>

            <button type="submit">Versturen</button>
        </form>
    </div>
</body>
</html>
